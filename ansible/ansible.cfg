[defaults]
# Инвентарь по умолчанию — команды можно звать без -i
inventory = inventory/hosts.yaml

[ssh_connection]
# accept-new: первый контакт записывает ключ в known_hosts без вопроса «yes»,
# дальнейшие подключения продолжают проверять ключ (в отличие от отключения проверки)
ssh_args = -o StrictHostKeyChecking=accept-new
