- name: Установить базовые пакеты
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gnupg, socat, conntrack]
    state: present
    update_cache: true

- name: Отключить swap (немедленно)
  ansible.builtin.command: swapoff -a
  changed_when: true

- name: Убрать swap из fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s)'
    replace: '# \1'

- name: Загрузить модули ядра при старте
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
      ip_vs
      ip_vs_rr
      ip_vs_wrr
      ip_vs_sh
      nf_conntrack

- name: Загрузить модули ядра сейчас
  ansible.builtin.shell: |
    for mod in overlay br_netfilter ip_vs ip_vs_rr ip_vs_wrr ip_vs_sh nf_conntrack; do
      modprobe $mod
    done
  changed_when: true

- name: Sysctl для Kubernetes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Применить sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
