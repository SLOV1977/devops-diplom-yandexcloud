fullnameOverride: kps

# ── Prometheus ────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 4GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # local-path создаёт каталог PVC от root, а контейнер по умолчанию
    # работает под uid 1000 — отсюда "permission denied" на queries.active.
    # Поэтому стейтфулсет запускается под root (known limitation для диплома)
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
      runAsNonRoot: false
    # Мониторы и правила из любого namespace, не только с лейблом релиза
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}

# ── Alertmanager ──────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    retention: 24h
    # та же причина, что у Prometheus: PVC на local-path создаётся от root
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
      runAsNonRoot: false
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

# ── Grafana ───────────────────────────────────────────────
grafana:
  adminUser: admin
  adminPassword: "diplom-admin"     # для диплома ок; в реальном проекте — из секретов
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  # дефолтный uid Grafana — 472; с PVC от root может не стартовать, поэтому тоже root
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
  service:
    type: ClusterIP
    port: 80
  # Ингресс — отдельным манифестом grafana-ingress.yaml (pass-through, без rewrite)
  ingress:
    enabled: false
  # Grafana живёт под подпутём /grafana.
  # 84.201.174.104 подставляется при рендере из terraform output —
  # единственного источника истины по IP (тот же, что в hosts.yaml)
  grafana.ini:
    server:
      root_url: http://84.201.174.104/grafana/
      serve_from_sub_path: true
  sidecar:
    dashboards:
      enabled: true
      allowUiUpdates: true

# ── Оператор и экспортёры ─────────────────────────────────
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  admissionWebhooks:
    enabled: true

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

defaultRules:
  create: true
